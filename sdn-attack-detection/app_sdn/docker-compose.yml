# =============================================================================
# docker-compose.yml — Orchestration του application-level SDN (Digital Twin)
#
# Υλοποιεί την αρχιτεκτονική microservices της διπλωματικής:
#   - controller : Control Plane + Intelligence/Defense Plane (Flask + Isolation Forest)
#   - dashboard  : Management Plane (Dash/Cytoscape)
#   - switch     : Data Plane (application-level overlay, UDP)
#
# Εκτέλεση (από τη ρίζα του project):
#   docker compose -f app_sdn/docker-compose.yml up --build
#   # μετά: άνοιξε http://localhost:8050 για το dashboard
#   # για κίνηση/επιθέσεις: docker compose exec controller python3 app_sdn/simulate.py
# =============================================================================
services:

  controller:
    build:
      context: ..
      dockerfile: app_sdn/Dockerfile
    container_name: sdn_controller
    command: python3 app_sdn/controller.py
    environment:
      - SWITCH_API_KEY=sdn-secret-2024
      - DEFENSE_MODE=0          # 1 για να ενεργοποιηθεί η άμυνα injection
    ports:
      - "9000:9000"          # REST API (southbound)
    networks: [sdn_net]
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; requests.get('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: ..
      dockerfile: app_sdn/Dockerfile
    container_name: sdn_dashboard
    command: python3 app_sdn/dashboard.py
    environment:
      - CONTROLLER_URL=http://controller:9000
    ports:
      - "8050:8050"          # Web UI
    depends_on:
      controller:
        condition: service_healthy
    networks: [sdn_net]

  switch:
    build:
      context: ..
      dockerfile: app_sdn/Dockerfile
    container_name: sdn_switch
    command: python3 app_sdn/switch.py --id s1 --controller http://controller:9000 --port 8000
    environment:
      - SWITCH_API_KEY=sdn-secret-2024
    depends_on:
      controller:
        condition: service_healthy
    networks: [sdn_net]

  # ---------------------------------------------------------------
  # Mininet container: πραγματική τοπολογία OVS + Ryu bridge
  #   - τρέχει ΜΕΤΑ από τον controller (depends_on + healthcheck)
  #   - ο Ryu bridge controller μιλάει με τον Flask controller μέσω sdn_net
  #   - απαιτεί privileged mode για Mininet network namespaces + OVS
  # ---------------------------------------------------------------
  mininet:
    build:
      context: ..
      dockerfile: simulation/Dockerfile.mininet
    container_name: sdn_mininet
    privileged: true          # απαιτείται για Mininet + OVS kernel namespaces
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      - CONTROLLER_URL=http://controller:9000
      - SWITCH_API_KEY=sdn-secret-2024
      - NORMAL_PHASE=30
      - ATTACK_PHASE=30
      - RECOVERY_PHASE=20
      - LOOP_CYCLES=0
      - PYTHONUNBUFFERED=1
    depends_on:
      controller:
        condition: service_healthy
    networks: [sdn_net]
    restart: "no"             # τρέχει μία φορά (demo scenario)

  # ---------------------------------------------------------------
  # Mode B: Ryu/OpenFlow controller
  #   Start with: docker compose --profile ryu up
  #   This replaces the standalone OVS switch with a proper OpenFlow 1.3
  #   pipeline: Mininet topology → OVS → Ryu (OpenFlow) → Flask ML controller
  # ---------------------------------------------------------------
  ryu:
    build:
      context: ..
      dockerfile: simulation/Dockerfile.mininet
    container_name: sdn_ryu
    profiles: ["ryu"]          # only starts with: docker compose --profile ryu up
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    command: >
      bash -c "service openvswitch-switch start &&
               ovs-vswitchd --detach --pidfile
                 --log-file=/var/log/openvswitch/ovs-vswitchd.log || true &&
               sleep 2 &&
               python3 -u simulation/mininet_ryu.py"
    environment:
      - CONTROLLER_URL=http://controller:9000
      - SWITCH_API_KEY=sdn-secret-2024
      - NORMAL_PHASE=30
      - ATTACK_PHASE=30
      - RECOVERY_PHASE=20
      - LOOP_CYCLES=0
      - RYU_OFP_PORT=6653
      - PYTHONUNBUFFERED=1
    depends_on:
      controller:
        condition: service_healthy
    networks: [sdn_net]
    restart: "no"

networks:
  sdn_net:
    driver: bridge
